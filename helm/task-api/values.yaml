# Default values for task-api.

internalPostgresql:
  enabled: false

global:
  security:
    allowInsecureImages: true

postgresdb:
  enabled: true

  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.2.0-debian-12-r8

  auth:
    database: taskdb
    username: taskuser
    password: "taskpass"
  
  primary:
    persistence:
      enabled: true
      size: 1Gi

env:
  DB_HOST: "task-api-postgresdb"
  DB_PRIMARY_HOST: "task-api-postgresdb"
  DB_READ_HOST: "task-api-postgresdb"
  DB_PORT: "5432"
  DB_NAME: "taskdb"
  DB_USER: "taskuser"
  APP_ENV: "dev"
  
  CACHE_ENABLED: "true"
  CACHE_TTL_SECONDS: "60"
  REDIS_HOST: "redis-master.redis.svc.cluster.local"
  REDIS_PORT: "6379"

  OTEL_SERVICE_NAME: "task-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.tracing.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_TRACES_SAMPLER: "parentbased_always_on"

secretEnv:
  # Legacy mode only: replace these placeholders before deployment.
  DB_PASSWORD: "REPLACE_ME"
  REDIS_PASSWORD: "REPLACE_ME"

secret:
  create: true
  existingSecret: ""

containerPort: 8000

replicaCount: 1

image:
  repository: task-api
  tag: "0.2.1"
  pullPolicy: Never

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: task-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers

resources: {}

terminationGracePeriodSeconds: 45

lifecycle:
  preStop:
    enabled: true
    command:
      - /bin/sh
      - -c
      - |
        python - <<'PY'
        import time
        import urllib.request

        request = urllib.request.Request(
            "http://127.0.0.1:8000/internal/drain",
            method="POST",
        )

        try:
            urllib.request.urlopen(request, timeout=2).read()
        except Exception as exc:
            print(f"event=pre_stop_drain_failed error={exc}", flush=True)

        time.sleep(10)
        PY

livenessProbe:
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  path: /readyz
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 1
  successThreshold: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  behavior: {}

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
